<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đang mở trang...</title>
</head>
<body>
    <p>Đang mở trang được yêu cầu...</p>
    <script>
        const requestedPath = location.pathname;
        const routeMarker = requestedPath.indexOf("/home");
        const appBase = routeMarker >= 0
            ? requestedPath.slice(0, routeMarker)
            : "";
        const route = `${requestedPath.slice(appBase.length)}${location.search}${location.hash}`;
        location.replace(`${appBase}/?__route=${encodeURIComponent(route)}`);
    </script>
</body>
</html>
